<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>60 Day DSA Practice Tracker</title>

  <style>
    :root {
      --easy-color: #2e7d32;
      --medium-color: #f9a825;
      --hard-color: #c62828;

      --card-bg: rgba(40, 40, 40, 0.85);
      --card-shadow: rgba(255, 255, 255, 0.08);

      --day-bg: #181818;
      --topic-bg: #222222;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 0;
      background-color: #000000;
      color: #f5f5f5;
      line-height: 1.4;
    }

    header {
      background-color: #151515;
      color: white;
      padding: 24px 20px;
      text-align: center;
      box-shadow: 0 2px 6px rgba(255, 255, 255, 0.05);
    }

    header h1 {
      margin: 0 0 8px;
    }

    header p {
      margin: 0;
      color: #aaa;
    }

    .container {
      max-width: 1050px;
      margin: auto;
      padding: 20px;
    }

    /* ================= SUMMARY ================= */

    .summary {
      font-size: 17px;
      margin-bottom: 20px;
      background: var(--card-bg);
      padding: 18px;
      border-radius: 8px;
      box-shadow: 0 2px 4px var(--card-shadow);

      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      text-align: center;
    }

    .summary-item {
      min-width: 130px;
    }

    .summary-number {
      display: block;
      font-size: 22px;
      font-weight: bold;
      color: white;
    }

    .summary-label {
      font-size: 13px;
      color: #999;
    }

    /* ================= FILTERS ================= */

    .filters {
      margin-bottom: 25px;
      text-align: center;

      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    label {
      font-size: 15px;
      color: #ccc;
    }

    select {
      background-color: #1f1f1f;
      color: #f5f5f5;
      border: 1px solid #555;
      padding: 7px 10px;
      border-radius: 5px;
    }

    /* ================= DAY ================= */

    .day-section {
      margin-top: 35px;
    }

    .day-header {
      background: var(--day-bg);
      border-left: 4px solid #777;
      padding: 15px 18px;
      border-radius: 8px;

      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
    }

    .day-title {
      margin: 0;
      font-size: 21px;
    }

    .day-goal {
      margin: 4px 0 0;
      color: #999;
      font-size: 14px;
    }

    .day-count {
      color: #bbb;
      font-size: 14px;
      white-space: nowrap;
    }

    /* ================= TOPIC ================= */

    .topic-section {
      margin-top: 15px;
    }

    .topic-header {
      background: var(--topic-bg);
      padding: 10px 14px;
      border-radius: 6px;

      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topic-header h3 {
      margin: 0;
      font-size: 16px;
    }

    .topic-count {
      color: #999;
      font-size: 13px;
    }

    /* ================= QUESTIONS ================= */

    ul {
      list-style: none;
      padding: 0;
      margin: 8px 0 0;
    }

    li {
      background-color: var(--card-bg);
      padding: 14px 15px;
      margin-bottom: 8px;
      border-radius: 8px;

      box-shadow: 0 2px 4px var(--card-shadow);

      display: flex;
      justify-content: space-between;
      align-items: center;

      gap: 12px;
      flex-wrap: wrap;

      transition: all 0.2s ease;
    }

    li:hover {
      background-color: rgba(70, 70, 70, 0.9);
      transform: scale(1.005);
    }

    .question-left {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .checkbox {
      transform: scale(1.25);
      margin-right: 5px;
      cursor: pointer;
    }

    a {
      text-decoration: none;
      color: #66b2ff;
      font-weight: bold;
      word-break: break-word;
    }

    a:hover {
      text-decoration: underline;
    }

    .difficulty-badge {
      padding: 2px 8px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: bold;
      color: #fff;
      white-space: nowrap;
    }

    .difficulty-badge.easy {
      background: var(--easy-color);
    }

    .difficulty-badge.medium {
      background: var(--medium-color);
      color: #000;
    }

    .difficulty-badge.hard {
      background: var(--hard-color);
    }

    /* ================= STATUS ================= */

    .question-status {
      font-size: 12px;
      color: #777;
    }

    /* ================= RESPONSIVE ================= */

    @media (max-width: 600px) {
      .day-header,
      .topic-header {
        align-items: flex-start;
      }

      li {
        flex-direction: column;
        align-items: flex-start;
      }

      .question-left {
        width: 100%;
      }
    }
  </style>
</head>

<body>

  <header>
    <h1>60 Day DSA Practice Roadmap</h1>
    <p>Service-Based Companies + Startups</p>
  </header>

  <div class="container">

    <div class="summary" id="summary">
      Loading...
    </div>

    <div class="filters">

      <label for="dayFilter">
        Day:
      </label>

      <select id="dayFilter">
        <option value="All">All Days</option>
      </select>

      <label for="difficultyFilter">
        Difficulty:
      </label>

      <select id="difficultyFilter">
        <option value="All">All</option>
        <option value="Easy">Easy</option>
        <option value="Medium">Medium</option>
        <option value="Hard">Hard</option>
      </select>

    </div>

    <div id="questionContainer"></div>

  </div>


  <script>

    /* =========================================================
       HELPERS
    ========================================================= */

    function slugify(str) {
      return str
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, '-')
        .replace(/^-+|-+$/g, '');
    }


    /*
      IMPORTANT:

      Day is included in the storage key.

      This prevents two questions with the same title
      appearing on different days from sharing the same
      checkbox state.
    */

    function storageKey(day, topic, title) {
      return `dsa-${slugify(day)}-${slugify(topic)}-${slugify(title)}`;
    }


    function getStoredChecked(key) {
      return localStorage.getItem(key) === 'true';
    }


    function setStoredChecked(key, value) {
      localStorage.setItem(
        key,
        value ? 'true' : 'false'
      );
    }


    /* =========================================================
       LOAD QUESTIONS
    ========================================================= */

    async function loadQuestions() {

      try {

        const response = await fetch('questions.json');

        if (!response.ok) {
          throw new Error('Unable to load questions.json');
        }

        const questions = await response.json();

        const container =
          document.getElementById('questionContainer');

        const summary =
          document.getElementById('summary');

        const dayFilter =
          document.getElementById('dayFilter');

        const difficultyFilter =
          document.getElementById('difficultyFilter');


        /*
          Expected questions.json structure:

          {
            "Day 1": {
              "goal": "...",

              "topics": {
                "Arrays": [
                  ["Two Sum", "url", "Easy"],
                  ["Best Time to Buy and Sell Stock", "url", "Easy"]
                ]
              }
            },

            "Day 2": {
              ...
            }
          }
        */


        const days = Object.keys(questions);


        /* =====================================================
           POPULATE DAY FILTER
        ===================================================== */

        days.forEach(day => {

          const option =
            document.createElement('option');

          option.value = day;
          option.textContent = day;

          dayFilter.appendChild(option);

        });


        /* =====================================================
           TOTAL STATISTICS
        ===================================================== */

        function getAllQuestions() {

          const allQuestions = [];

          days.forEach(day => {

            const dayData = questions[day];

            Object.keys(dayData.topics).forEach(topic => {

              dayData.topics[topic].forEach(
                ([title, url, difficulty]) => {

                  allQuestions.push({
                    day,
                    topic,
                    title,
                    url,
                    difficulty
                  });

                }
              );

            });

          });

          return allQuestions;
        }


        const allQuestions = getAllQuestions();


        /* =====================================================
           RENDER
        ===================================================== */

        function renderQuestions() {

          container.innerHTML = '';

          const selectedDay =
            dayFilter.value;

          const selectedDifficulty =
            difficultyFilter.value;


          let totalShown = 0;
          let solvedShown = 0;


          days.forEach(day => {

            if (
              selectedDay !== 'All' &&
              selectedDay !== day
            ) {
              return;
            }


            const dayData = questions[day];


            const filteredTopics = {};


            Object.keys(dayData.topics).forEach(topic => {

              const filtered =
                dayData.topics[topic].filter(
                  ([title, url, difficulty]) => {

                    return (
                      selectedDifficulty === 'All' ||
                      difficulty === selectedDifficulty
                    );

                  }
                );


              if (filtered.length > 0) {
                filteredTopics[topic] = filtered;
              }

            });


            if (
              Object.keys(filteredTopics).length === 0
            ) {
              return;
            }


            /* =================================================
               DAY HEADER
            ================================================= */

            const daySection =
              document.createElement('section');

            daySection.className = 'day-section';


            const dayHeader =
              document.createElement('div');

            dayHeader.className = 'day-header';


            const dayTitleWrapper =
              document.createElement('div');


            const dayTitle =
              document.createElement('h2');

            dayTitle.className = 'day-title';
            dayTitle.textContent = day;


            const dayGoal =
              document.createElement('p');

            dayGoal.className = 'day-goal';

            dayGoal.textContent =
              dayData.goal || 'Practice and revise';


            dayTitleWrapper.appendChild(dayTitle);
            dayTitleWrapper.appendChild(dayGoal);


            const dayCount =
              document.createElement('div');

            dayCount.className = 'day-count';


            dayHeader.appendChild(dayTitleWrapper);
            dayHeader.appendChild(dayCount);

            daySection.appendChild(dayHeader);


            let dayTotal = 0;
            let daySolved = 0;


            /* =================================================
               TOPICS
            ================================================= */

            Object.keys(filteredTopics).forEach(topic => {

              const topicQuestions =
                filteredTopics[topic];


              const topicSection =
                document.createElement('div');

              topicSection.className =
                'topic-section';


              const topicHeader =
                document.createElement('div');

              topicHeader.className =
                'topic-header';


              const topicTitle =
                document.createElement('h3');

              topicTitle.textContent = topic;


              const topicCount =
                document.createElement('span');

              topicCount.className =
                'topic-count';


              let topicSolved = 0;


              topicQuestions.forEach(
                ([title]) => {

                  const key =
                    storageKey(
                      day,
                      topic,
                      title
                    );


                  if (
                    getStoredChecked(key)
                  ) {
                    topicSolved++;
                  }

                }
              );


              topicCount.textContent =
                `${topicQuestions.length} Questions • Solved ${topicSolved}`;


              topicHeader.appendChild(topicTitle);
              topicHeader.appendChild(topicCount);


              topicSection.appendChild(topicHeader);


              const ul =
                document.createElement('ul');


              topicQuestions.forEach(
                ([title, url, difficulty]) => {

                  const li =
                    document.createElement('li');


                  const left =
                    document.createElement('div');

                  left.className =
                    'question-left';


                  const checkbox =
                    document.createElement('input');

                  checkbox.type = 'checkbox';
                  checkbox.className = 'checkbox';


                  const key =
                    storageKey(
                      day,
                      topic,
                      title
                    );


                  checkbox.checked =
                    getStoredChecked(key);


                  checkbox.addEventListener(
                    'change',
                    () => {

                      setStoredChecked(
                        key,
                        checkbox.checked
                      );

                      renderQuestions();

                    }
                  );


                  const link =
                    document.createElement('a');

                  link.href = url;
                  link.target = '_blank';
                  link.rel = 'noopener noreferrer';
                  link.textContent = title;


                  const badge =
                    document.createElement('span');

                  const diff =
                    difficulty || 'Unknown';


                  badge.className =
                    `difficulty-badge ${diff.toLowerCase()}`;

                  badge.textContent =
                    diff;


                  left.appendChild(checkbox);
                  left.appendChild(link);
                  left.appendChild(badge);


                  li.appendChild(left);

                  ul.appendChild(li);


                  dayTotal++;
                  totalShown++;


                  if (
                    checkbox.checked
                  ) {
                    daySolved++;
                    solvedShown++;
                  }

                }
              );


              topicSection.appendChild(ul);

              daySection.appendChild(topicSection);

            });


            dayCount.textContent =
              `${daySolved}/${dayTotal} solved`;


            container.appendChild(daySection);

          });


          /* =====================================================
             SUMMARY
          ===================================================== */

          const totalSolved =
            allQuestions.reduce(
              (count, q) => {

                const key =
                  storageKey(
                    q.day,
                    q.topic,
                    q.title
                  );

                return (
                  count +
                  (getStoredChecked(key)
                    ? 1
                    : 0)
                );

              },
              0
            );


          summary.innerHTML = `

            <div class="summary-item">
              <span class="summary-number">
                ${allQuestions.length}
              </span>
              <span class="summary-label">
                Total Questions
              </span>
            </div>

            <div class="summary-item">
              <span class="summary-number">
                ${totalSolved}
              </span>
              <span class="summary-label">
                Completed
              </span>
            </div>

            <div class="summary-item">
              <span class="summary-number">
                ${allQuestions.length - totalSolved}
              </span>
              <span class="summary-label">
                Remaining
              </span>
            </div>

            <div class="summary-item">
              <span class="summary-number">
                ${Math.round(
                  (totalSolved /
                    allQuestions.length) *
                    100
                ) || 0}%
              </span>
              <span class="summary-label">
                Progress
              </span>
            </div>

          `;

        }


        dayFilter.addEventListener(
          'change',
          renderQuestions
        );


        difficultyFilter.addEventListener(
          'change',
          renderQuestions
        );


        renderQuestions();


      } catch (error) {

        console.error(error);

        document.getElementById(
          'questionContainer'
        ).innerHTML = `

          <div style="
            background:#301010;
            padding:20px;
            border-radius:8px;
            color:#ffb3b3;
          ">
            <strong>
              Could not load questions.json
            </strong>

            <p>
              Make sure questions.json is in
              the same folder as this HTML file.
            </p>
          </div>

        `;

      }

    }


    loadQuestions();

  </script>

</body>
</html>
