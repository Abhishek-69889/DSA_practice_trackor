
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>60 Day DSA Practice Tracker - Fixed</title>
<style>
:root { --easy-color:#2e7d32; --medium-color:#f9a825; --hard-color:#c62828; --card-bg:rgba(40,40,40,0.85); --card-shadow:rgba(255,255,255,0.08); --day-bg:#181818; --topic-bg:#222222; }
* { box-sizing:border-box; }
body { font-family:Arial,sans-serif; margin:0; padding:0; background:#000; color:#f5f5f5; line-height:1.4; }
header { background:#151515; color:white; padding:24px 20px; text-align:center; box-shadow:0 2px 6px rgba(255,255,255,0.05); }
.container { max-width:1050px; margin:auto; padding:20px; }
.summary { font-size:17px; margin-bottom:20px; background:var(--card-bg); padding:18px; border-radius:8px; display:flex; justify-content:space-around; align-items:center; flex-wrap:wrap; gap:12px; text-align:center; }
.summary-number { display:block; font-size:22px; font-weight:bold; color:white; }
.summary-label { font-size:13px; color:#999; }
.filters { margin-bottom:25px; text-align:center; display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
select { background:#1f1f1f; color:#f5f5f5; border:1px solid #555; padding:7px 10px; border-radius:5px; }
.day-section { margin-top:35px; }
.day-header { background:var(--day-bg); border-left:4px solid #777; padding:15px 18px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; gap:15px; flex-wrap:wrap; }
.day-title { margin:0; font-size:21px; }
.day-goal { margin:4px 0 0; color:#999; font-size:14px; }
.day-count { color:#bbb; font-size:14px; }
.topic-section { margin-top:15px; }
.topic-header { background:var(--topic-bg); padding:10px 14px; border-radius:6px; display:flex; justify-content:space-between; align-items:center; }
ul { list-style:none; padding:0; margin:8px 0 0; }
li { background:var(--card-bg); padding:14px 15px; margin-bottom:8px; border-radius:8px; display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; transition:all 0.2s; }
li:hover { background:rgba(70,70,70,0.9); }
.question-left { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.checkbox { transform:scale(1.25); margin-right:5px; cursor:pointer; }
a { text-decoration:none; color:#66b2ff; font-weight:bold; word-break:break-word; }
.difficulty-badge { padding:2px 8px; border-radius:12px; font-size:11px; font-weight:bold; color:#fff; white-space:nowrap; }
.difficulty-badge.easy { background:var(--easy-color); }
.difficulty-badge.medium { background:var(--medium-color); color:#000; }
.difficulty-badge.hard { background:var(--hard-color); }
.tags { font-size:11px; color:#888; margin-left:6px; }
</style>
</head>
<body>
<header><h1>60 Day DSA Practice Roadmap</h1><p>Service-Based Companies + Startups - Pattern Based</p></header>
<div class="container">
<div class="summary" id="summary">Loading...</div>
<div class="filters">
<label>Day: <select id="dayFilter"><option value="All">All Days</option></select></label>
<label>Difficulty: <select id="difficultyFilter"><option value="All">All</option><option value="Easy">Easy</option><option value="Medium">Medium</option><option value="Hard">Hard</option></select></label>
<label>Search: <input id="searchFilter" placeholder="Search pattern..." style="background:#1f1f1f;color:#fff;border:1px solid #555;padding:7px;border-radius:5px;"></label>
</div>
<div id="questionContainer"></div>
</div>
<script>
function slugify(str){return str.toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'');}
function storageKey(day,title){return `dsa-${slugify(day)}-${slugify(title)}`;}
function getStoredChecked(k){return localStorage.getItem(k)==='true';}
function setStoredChecked(k,v){localStorage.setItem(k, v?'true':'false');}

async function loadQuestions(){
 try{
  // Try new bank format first
  let response = await fetch('60-day-dsa-bank.json');
  let raw;
  if(response.ok){
    raw = await response.json();
  } else {
    // fallback to questions.json
    response = await fetch('questions.json');
    if(!response.ok) throw new Error('No json found');
    raw = await response.json();
    // Convert old topics object format to new questions format for unified rendering
    let convertedRaw = {meta:{}};
    for(let day of Object.keys(raw)){
      let dayData = raw[day];
      let questions = [];
      if(dayData.topics && typeof dayData.topics === 'object' && !Array.isArray(dayData.topics)){
        for(let topic of Object.keys(dayData.topics)){
          for(let [title,url,diff] of dayData.topics[topic]){
            questions.push({title,url,difficulty:diff,tags:[topic],source:'LeetCode'});
          }
        }
        convertedRaw[day]={goal:dayData.goal||'',topics:Object.keys(dayData.topics),questions};
      } else {
        convertedRaw[day]=dayData;
      }
    }
    raw = convertedRaw;
  }

  const days = Object.keys(raw).filter(k=>k.startsWith('Day')).sort((a,b)=>parseInt(a.split(' ')[1])-parseInt(b.split(' ')[1]));
  const container=document.getElementById('questionContainer');
  const summary=document.getElementById('summary');
  const dayFilter=document.getElementById('dayFilter');
  const diffFilter=document.getElementById('difficultyFilter');
  const searchFilter=document.getElementById('searchFilter');

  days.forEach(day=>{
    let opt=document.createElement('option');
    opt.value=day; opt.textContent=day;
    dayFilter.appendChild(opt);
  });

  function getAllQs(){
    let all=[];
    days.forEach(day=>{
      let d=raw[day];
      if(!d || !d.questions) return;
      d.questions.forEach(q=>all.push({day,title:q.title}));
    });
    return all;
  }
  const allQs=getAllQs();

  function render(){
    container.innerHTML='';
    let selectedDay=dayFilter.value;
    let selectedDiff=diffFilter.value;
    let search=searchFilter.value.toLowerCase();

    let totalShown=0;

    days.forEach(day=>{
      if(selectedDay!=='All' && selectedDay!==day) return;
      let dayData=raw[day];
      if(!dayData || !dayData.questions) return;

      let filtered = dayData.questions.filter(q=>{
        if(selectedDiff!=='All' && q.difficulty!==selectedDiff) return false;
        if(search && !(q.title.toLowerCase().includes(search) || (q.tags||[]).join(' ').toLowerCase().includes(search))) return false;
        return true;
      });
      if(filtered.length===0) return;

      let daySection=document.createElement('section');
      daySection.className='day-section';
      let dayHeader=document.createElement('div');
      dayHeader.className='day-header';
      dayHeader.innerHTML=`<div><h2 class="day-title">${day}</h2><p class="day-goal">${dayData.goal||''}<br><small style="color:#666">${(dayData.topics||[]).join(' • ')}</small></p></div><div class="day-count" id="count-${slugify(day)}"></div>`;
      daySection.appendChild(dayHeader);

      let ul=document.createElement('ul');
      let daySolved=0;

      filtered.forEach(q=>{
        let li=document.createElement('li');
        let left=document.createElement('div');
        left.className='question-left';
        let cb=document.createElement('input');
        cb.type='checkbox'; cb.className='checkbox';
        let key=storageKey(day,q.title);
        cb.checked=getStoredChecked(key);
        if(cb.checked) daySolved++;
        cb.addEventListener('change',()=>{setStoredChecked(key,cb.checked); render();});
        let link=document.createElement('a');
        link.href=q.url; link.target='_blank'; link.rel='noopener noreferrer'; link.textContent=q.title;
        let badge=document.createElement('span');
        badge.className=`difficulty-badge ${q.difficulty.toLowerCase()}`;
        badge.textContent=q.difficulty;
        let tags=document.createElement('span');
        tags.className='tags';
        tags.textContent=(q.tags||[]).join(', ');
        left.appendChild(cb); left.appendChild(link); left.appendChild(badge); left.appendChild(tags);
        li.appendChild(left);
        ul.appendChild(li);
        totalShown++;
      });

      daySection.appendChild(ul);
      container.appendChild(daySection);
      let countEl=dayHeader.querySelector(`#count-${slugify(day)}`);
      if(countEl) countEl.textContent=`${daySolved}/${filtered.length} solved`;
    });

    let totalSolved=allQs.reduce((c,q)=>c+(getStoredChecked(storageKey(q.day,q.title))?1:0),0);
    summary.innerHTML=`
      <div><span class="summary-number">${allQs.length}</span><span class="summary-label">Total</span></div>
      <div><span class="summary-number">${totalSolved}</span><span class="summary-label">Completed</span></div>
      <div><span class="summary-number">${allQs.length-totalSolved}</span><span class="summary-label">Remaining</span></div>
      <div><span class="summary-number">${Math.round(totalSolved/allQs.length*100)||0}%</span><span class="summary-label">Progress</span></div>
    `;
  }

  dayFilter.addEventListener('change',render);
  diffFilter.addEventListener('change',render);
  searchFilter.addEventListener('input',render);
  render();
 } catch(e){
  console.error(e);
  document.getElementById('questionContainer').innerHTML=`<div style="background:#301010;padding:20px;border-radius:8px;color:#ffb3b3"><strong>Could not load JSON</strong><p>${e.message}</p><p>Make sure 60-day-dsa-bank.json and this HTML are in same folder, or use questions.json</p></div>`;
 }
}
loadQuestions();
</script>
</body>
</html>
